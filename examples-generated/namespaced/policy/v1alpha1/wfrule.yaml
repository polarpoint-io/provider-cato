apiVersion: policy.cato.m.crossplane.io/v1alpha1
kind: WfRule
metadata:
  annotations:
    meta.upbound.io/example-id: policy/v1alpha1/wfrule
  labels:
    testing.upbound.io/example-name: allow_all_and_log
  name: allow-all-and-log
  namespace: crossplane-system
spec:
  forProvider:
    at:
      position: LAST_IN_POLICY
    rule:
      action: ALLOW
      direction: BOTH
      enabled: true
      name: Allow all & logs
      tracking:
        event:
          enabled: true

---

apiVersion: policy.cato.m.crossplane.io/v1alpha1
kind: WfSection
metadata:
  annotations:
    meta.upbound.io/example-id: policy/v1alpha1/wfrule
  labels:
    testing.upbound.io/example-name: wf_section
  name: wf-section
  namespace: crossplane-system
spec:
  forProvider:
    at:
      position: LAST_IN_POLICY
    section:
      name: WF Section
