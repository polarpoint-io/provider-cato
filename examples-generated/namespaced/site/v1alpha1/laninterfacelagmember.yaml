apiVersion: site.cato.m.crossplane.io/v1alpha1
kind: LanInterfaceLagMember
metadata:
  annotations:
    meta.upbound.io/example-id: site/v1alpha1/laninterfacelagmember
  labels:
    testing.upbound.io/example-name: lag2
  name: lag2
  namespace: crossplane-system
spec:
  forProvider:
    destType: LAN_LAG_MEMBER
    interfaceId: INT_6
