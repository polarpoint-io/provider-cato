apiVersion: policy.cato.crossplane.io/v1alpha1
kind: IfSection
metadata:
  annotations:
    meta.upbound.io/example-id: policy/v1alpha1/ifsection
  labels:
    testing.upbound.io/example-name: if_section_1
  name: if-section-1
spec:
  forProvider:
    at:
      position: LAST_IN_POLICY
    section:
      name: tf section

---

apiVersion: policy.cato.crossplane.io/v1alpha1
kind: IfRule
metadata:
  annotations:
    meta.upbound.io/example-id: policy/v1alpha1/ifsection
  labels:
    testing.upbound.io/example-name: if_rule_1
  name: if-rule-1
spec:
  forProvider:
    at:
      position: FIRST_IN_SECTION
      ref: ${cato_if_section.if_section_1.section.id}
    rule:
      action: ALLOW
      description: terraform test rules
      enabled: false
      name: test
