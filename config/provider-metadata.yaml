                          "public_site_ip": "1.1.1.1"
                        }
                      ]
                    },
                    "secondary": {
                      "public_cato_ip_id": "30112",
                      "tunnels": [
                        {
                          "last_mile_bw": {
                            "downstream": 10,
                            "upstream": 10
                          },
                          "private_cato_ip": "172.98.10.91",
