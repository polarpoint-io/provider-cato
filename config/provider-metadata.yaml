    cato_private_access_rule:
        subCategory: ""
        description: The cato_private_access_rule resource contains the configuration parameters for private access policy rule in the Cato platform.
        name: cato_private_access_rule
        title: cato_private_access_rule Resource - terraform-provider-cato
        examples:
            - name: all
              manifest: |-
                {
                  "action": "${each.value.action}",
                  "active_period": "${each.value.active_period}",
                  "applications": "${each.value.applications}",
                  "connection_origins": "${each.value.connection_origins}",
                  "countries": "${each.value.countries}",
                  "description": "${each.value.description}",
                  "devices": "${each.value.devices}",
                  "enabled": "${each.value.enabled}",
                  "for_each": "${local.rule_data}",
                  "name": "${each.key}",
                  "platforms": "${each.value.platforms}",
                  "schedule": "${each.value.schedule}",
                  "source": "${each.value.source}",
                  "tracking": "${each.value.tracking}",
                  "user_attributes": "${each.value.user_attributes}"
                }
              references:
                action: each.value.action
                active_period: each.value.active_period
                applications: each.value.applications
                connection_origins: each.value.connection_origins
                countries: each.value.countries
                description: each.value.description
                devices: each.value.devices
                enabled: each.value.enabled
                for_each: local.rule_data
                name: each.key
                platforms: each.value.platforms
                schedule: each.value.schedule
                source: each.value.source
                tracking: each.value.tracking
                user_attributes: each.value.user_attributes
              dependencies:
                cato_private_access_policy.this: |-
                    {
                      "enabled": true
                    }
                cato_private_access_rule_bulk.this: |-
                    {
                      "depends_on": [
                        "${cato_private_access_rule.all}",
                        "${cato_private_access_policy.this}"
                      ],
                      "rule_data": "${local.rule_data}"
                    }
        argumentDocs:
            action: (String) ALLOW or BLOCK
            active_on: (String) Type of a time range when a rule is active
            active_period: (Attributes) Time period during which the rule is active (see below for nested schema)
            alert: (Attributes) Alert settings (see below for nested schema)
            applications: (Attributes Set) Application name or id (see below for nested schema)
            category: (String) Risk score category
            connection_origins: (Set of String) Origin of the connection
            countries: (Attributes Set) List of countries (see below for nested schema)
            custom_recurring: (Attributes) Custom recurring time range that a rule is active (see below for nested schema)
            custom_timeframe: (Attributes) Custom one-time time range that a rule is active (see below for nested schema)
            days: (Set of String) Days of the week
            description: (String) Rule description
            devices: (Attributes Set) List of devices (see below for nested schema)
            effective_from: (String) Effective from (2006-01-02T15:04:05Z)
            enabled: (Boolean) TRUE = Rule is enabled FALSE = Rule is disabled
            event: (Attributes) Event settings (see below for nested schema)
            expires_at: (String) Expires at (2006-01-02T15:04:05Z)
            frequency: (String) Frequency of an alert event for a rule
            from: (String) From time (12:34)
            id: (String) Rule ID
            mailing_list: (Attributes Set) Mailing list name or id (see below for nested schema)
            name: (String) Rule name
            operator: (String) Risk score operator
            platforms: (Set of String) Platforms, operating systems
            risk_score: (Attributes) User's risk score settings (see below for nested schema)
            schedule: (Attributes) Schedule (see below for nested schema)
            source: (Attributes) Source (see below for nested schema)
            subscription_group: (Attributes Set) Subscription group name or id (see below for nested schema)
            to: (String) To time (12:34)
            tracking: (Attributes) Rule tracking (see below for nested schema)
            use_effective_from: (Boolean) Use effective from
            use_expires_at: (Boolean) Use expires at
            user_attributes: (Attributes) User attributes (see below for nested schema)
            user_groups: (Attributes Set) User groups (see below for nested schema)
            users: (Attributes Set) Users (see below for nested schema)
            webhook: (Attributes Set) Webhook name or id (see below for nested schema)
        importStatements: []
    cato_private_access_rule_bulk:
