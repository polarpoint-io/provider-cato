                    "ref": "${cato_if_section.if_section_1.section.id}"
                  },
                  "section": {
                    "name": "tf section 2"
                  }
                }
              dependencies:
                cato_if_rule.if_rule_1: |-
                    {
                      "at": {
                        "position": "FIRST_IN_SECTION",
                        "ref": "${cato_if_section.if_section_1.section.id}"
                      },
                      "rule": {
                        "action": "ALLOW",
                        "description": "terraform test rules",
                        "enabled": false,
                        "name": "test"
                      }
                    }
            - name: if_section_1
              manifest: |-
                {
                  "at": {
                    "position": "LAST_IN_POLICY"
                  },
                  "section": {
                    "name": "tf section"
                  }
                }
              dependencies:
                cato_if_rule.if_rule_1: |-
