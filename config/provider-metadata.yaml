    cato_tls_section:
        subCategory: ""
        description: The cato_tls_section resource contains the configuration parameters necessary to add TLS Inspection section (https://support.catonetworks.com/hc/en-us/articles/5590037900701-Adding-Sections-to-the-WAN-and-Internet-Firewalls). Documentation for the underlying API used in this resource can be found at mutation.policy.tlsInspect.addSection() https://api.catonetworks.com/documentation/#mutation-policy.tlsInspect.addSection.
        name: cato_tls_section
        title: cato_tls_section Resource - terraform-provider-cato
        examples:
            - name: section1
              manifest: |-
                {
                  "at": {
                    "position": "LAST_IN_POLICY"
                  },
                  "section": {
                    "name": "Custom TLS Rules"
                  }
                }
            - name: section2
              manifest: |-
                {
                  "at": {
                    "position": "AFTER_SECTION",
                    "ref": "${cato_tls_section.section1.section.id}"
                  },
                  "section": {
                    "name": "TLS Phases"
                  }
                }
        argumentDocs:
            at: (Attributes) (see below for nested schema)
            id: (String) Section ID
            name: (String) Section Name
            position: (String) Position relative to a policy, a section or another rule
            ref: (String) The identifier of the object (e.g. a rule, a section) relative to which the position of the added rule is defined
            section: (Attributes) Section parameters (see below for nested schema)
        importStatements: []
    cato_wan_interface:
        subCategory: ""
        description: The cato_wan_interface resource contains the configuration parameters necessary to add a wan interface to a socket. (virtual socket in AWS/Azure, or physical socket https://support.catonetworks.com/hc/en-us/articles/4413280502929-Working-with-X1500-X1600-and-X1700-Socket-Sites). Documentation for the underlying API used in this resource can be found at mutation.updateSocketInterface() https://api.catonetworks.com/documentation/#mutation-site.updateSocketInterface.
        name: cato_wan_interface
        title: cato_wan_interface Resource - terraform-provider-cato
        examples:
            - name: wan1
              manifest: |-
                {
                  "downstream_bandwidth": "100",
                  "interface_id": "WAN1",
                  "name": "Interface WAN 1",
                  "precedence": "ACTIVE",
                  "role": "wan_1",
                  "site_id": "${cato_socket_site.site1.id}",
                  "upstream_bandwidth": "100"
                }
              references:
                site_id: cato_socket_site.site1.id
        argumentDocs:
            downstream_bandwidth: (Number) WAN interface downstream bandwidth
            id: (String) The WAN interface ID, which is a combination of the site ID and the interface ID (e.g., site_id:interface_id, 12345:INT_1). This is used to identify the WAN interface resource.
            interface_id: (String) The interface ID, which is a unique identifier for the WAN interface (e.g., INT_1, INT_2, etc.). This is used to identify the specific WAN interface resource.
            name: (String) WAN interface name
            precedence: (String) WAN interface precedence (https://api.catonetworks.com/documentation/#definition-SocketInterfacePrecedenceEnum)
            role: (String) WAN interface role (https://api.catonetworks.com/documentation/#definition-SocketInterfaceRole)
            site_id: (String) Site ID
