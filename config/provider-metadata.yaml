    cato_if_sub_policy:
        subCategory: ""
        description: The cato_if_sub_policy resource manages an Internet Firewall sub-policy (a nested policy scoped by a SUB_POLICY_SCOPE rule). The Cato API has no updateSubPolicy mutation, so changing name or description forces resource replacement. Documentation for the underlying API can be found at mutation.policy.internetFirewall.addSubPolicy().
        name: cato_if_sub_policy
        title: cato_if_sub_policy Resource - terraform-provider-cato
        examples:
            - name: minimal
              manifest: |-
                {
                  "at": {
                    "position": "LAST_IN_POLICY"
                  },
                  "description": "Rules that only apply to remote users",
                  "name": "Remote Users Sub-Policy",
                  "scope": {
                    "connection_origin": "REMOTE",
                    "destination": {},
                    "enabled": true,
                    "source": {},
                    "tracking": {
                      "event": {
                        "enabled": true
                      }
                    }
                  }
                }
              dependencies:
                cato_if_rule.in_sub_policy: |-
                    {
                      "at": {
                        "position": "LAST_IN_POLICY"
                      },
                      "depends_on": [
                        "${cato_if_sub_policy.full}"
                      ],
                      "rule": {
                        "action": "BLOCK",
                        "destination": {
                          "domain": [
                            "test.com"
                          ]
                        },
                        "enabled": true,
                        "name": "Block test.com for Marketing",
                        "source": {},
                        "tracking": {
                          "event": {
                            "enabled": true
                          }
                        }
                      },
                      "sub_policy_id": "${cato_if_sub_policy.full.id}"
                    }
            - name: full
              manifest: |-
                {
                  "at": {
                    "position": "LAST_IN_POLICY"
                  },
                  "description": "Rules scoped to the Marketing user group",
                  "name": "Marketing Sub-Policy",
                  "scope": {
                    "destination": {},
                    "enabled": true,
                    "source": {
                      "users_group": [
                        {
                          "name": "Marketing-Teams"
                        }
                      ]
                    },
                    "tracking": {
                      "event": {
                        "enabled": true
                      }
                    }
                  }
                }
              dependencies:
                cato_if_rule.in_sub_policy: |-
                    {
                      "at": {
                        "position": "LAST_IN_POLICY"
                      },
                      "depends_on": [
                        "${cato_if_sub_policy.full}"
                      ],
                      "rule": {
                        "action": "BLOCK",
                        "destination": {
                          "domain": [
                            "test.com"
                          ]
                        },
                        "enabled": true,
                        "name": "Block test.com for Marketing",
                        "source": {},
                        "tracking": {
                          "event": {
                            "enabled": true
                          }
                        }
                      },
                      "sub_policy_id": "${cato_if_sub_policy.full.id}"
                    }
