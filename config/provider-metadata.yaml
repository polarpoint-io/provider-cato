    cato_wf_sub_policy:
        subCategory: ""
        description: The cato_wf_sub_policy resource manages a WAN Firewall sub-policy (a nested policy scoped by a SUB_POLICY_SCOPE rule). The Cato API has no updateSubPolicy mutation, so changing name or description forces resource replacement. Documentation for the underlying API can be found at mutation.policy.wanFirewall.addSubPolicy().
        name: cato_wf_sub_policy
        title: cato_wf_sub_policy Resource - terraform-provider-cato
        examples:
            - name: minimal
              manifest: |-
                {
                  "at": {
                    "position": "LAST_IN_POLICY"
                  },
                  "description": "Rules that only apply to branch sites",
                  "name": "Branch Sites Sub-Policy",
                  "scope": {
                    "destination": {},
                    "enabled": true,
                    "source": {},
                    "tracking": {
                      "event": {
                        "enabled": true
                      }
                    }
                  }
                }
              dependencies:
                cato_wf_rule.in_sub_policy: |-
                    {
                      "at": {
                        "position": "LAST_IN_POLICY"
