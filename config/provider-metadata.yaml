name: catonetworks/cato
resources:
    cato_account:
        subCategory: ""
        description: The cato_account resource contains the configuration parameters necessary to manage a Cato Networks account.
        name: cato_account
        title: cato_account Resource - terraform-provider-cato
        examples:
            - name: example_basic
              manifest: |-
                {
                  "name": "My-Customer-Account",
                  "timezone": "America/New_York"
                }
            - name: example_complete
              manifest: |-
                {
                  "description": "Primary customer account for Enterprise Corp",
                  "name": "Enterprise-Customer-Account",
                  "tenancy": "SINGLE_TENANT",
                  "timezone": "Europe/London",
                  "type": "CUSTOMER"
                }
            - name: example_multi_tenant
              manifest: |-
                {
                  "description": "Account supporting multiple tenants",
                  "name": "Multi-Tenant-Account",
                  "tenancy": "MULTI_TENANT",
                  "timezone": "Asia/Tokyo",
                  "type": "CUSTOMER"
                }
            - name: example_partner
              manifest: |-
                {
                  "description": "Account for partner organization",
                  "name": "Partner-Account",
                  "tenancy": "SINGLE_TENANT",
                  "timezone": "Pacific/Auckland",
                  "type": "PARTNER"
                }
        argumentDocs:
            description: (String) Account description
            id: (String) Account ID
            name: (String) Account name
            tenancy: (String) Tenancy type (SINGLE_TENANT or MULTI_TENANT)
            timezone: (String) Timezone of the account (e.g., Africa/Accra)
            type: (String) Account type (e.g., CUSTOMER)
        importStatements: []
    cato_admin:
        subCategory: ""
        description: The cato_admin resource contains the configuration parameters necessary to manage a Cato Networks admin user.
        name: cato_admin
        title: cato_admin Resource - terraform-provider-cato
        examples:
            - name: basic_admin
              manifest: |-
                {
                  "email": "admin@email.com",
                  "first_name": "John",
                  "last_name": "Doe",
                  "managed_roles": [
                    {
                      "id": "1"
                    }
                  ],
                  "password_never_expires": true
                }
            - name: basic_admin
              manifest: |-
                {
                  "account_id": "12345",
                  "email": "admin@email.com",
                  "first_name": "John",
                  "last_name": "Doe",
                  "managed_roles": [
                    {
                      "id": "1"
                    }
                  ],
                  "password_never_expires": true
                }
            - name: reseller_admin
              manifest: |-
                {
                  "email": "reseller@email.com",
                  "first_name": "John",
                  "last_name": "Doe",
                  "managed_roles": [
                    {
                      "allowed_accounts": [
                        "1234"
                      ],
                      "id": "1"
                    }
                  ],
                  "password_never_expires": true,
                  "reseller_roles": [
                    {
                      "id": "4"
                    }
                  ]
                }
        argumentDocs:
            account_id: (String) Account ID to which the admin belongs.
            admin_id: (String) Admin user ID
            allowed_accounts: (Set of String) List of allowed account IDs
            email: (String) Email address of the account
            first_name: (String) Account first name
            id: '(String) Unique ID for the admin user resource, consisting of ACCOUNT_ID:ADMIN_ID. Example: 123456:98765'
            last_name: (String) Account last name
            managed_roles: (Attributes Set) (see below for nested schema)
            mfa_enabled: (Boolean) Whether MFA is enabled for this admin, always true for admin users
            name: (String) Role name
            password_never_expires: (Boolean) Whether the password never expires
            reseller_roles: (Attributes Set) (see below for nested schema)
        importStatements: []
    cato_app_connector:
        subCategory: ""
        description: The cato_app_connector resource contains the configuration parameters necessary to manage an app connector.
        name: cato_app_connector
        title: cato_app_connector Resource - terraform-provider-cato
        examples:
            - name: example
              manifest: |-
                {
                  "description": "example-app-connector description",
                  "group_name": "example-group",
                  "location": {
                    "address": "123 Main St",
                    "city_name": "San Francisco",
                    "country_code": "US",
                    "state_code": "US-CA",
                    "timezone": "America/Los_Angeles"
                  },
                  "name": "example-app-connector",
                  "preferred_pop_location": {
                    "automatic": false,
                    "preferred_only": true,
                    "primary": {
                      "name": "New York"
                    },
                    "secondary": {
                      "name": "Chicago"
                    }
                  },
                  "type": "VIRTUAL"
                }
        argumentDocs:
            address: (String) Street, number
            automatic: (Boolean) Automatic PoP location
            city_name: (String) City name
            country_code: (String) Country code
            description: (String) Optional description of the ZTNA App Connector (max 250 characters)
            group_name: (String) Name of the ZTNA App Connector group. It will be created if it does not exist.
            id: (String) The unique ID of the ZTNA App Connector
            location: (Attributes) App connector location (see below for nested schema)
            name: (String) The unique name of the ZTNA App Connector
            preferred_only: (Boolean) Restrict connector attachment exclusively to the configured pop locations
            preferred_pop_location: (Attributes) Preferred PoP locations settings (see below for nested schema)
            primary: (Attributes) Physical location of the pripary Pop (see below for nested schema)
            private_apps: (Attributes Set) List of private applications (see below for nested schema)
            secondary: (Attributes) Physical location of the secondary Pop (see below for nested schema)
            serial_number: (String) Unique serial number of the ZTNA App Connector
            socket_id: (String) Connector type (virtual, physical)
            socket_model: (String) Socket model of the ZTNA App Connector
            state_code: (String) State code
            timezone: (String) Timezone
            type: (String) Connector type (virtual, physical)
        importStatements: []
    cato_app_tenant_restriction_rule:
        subCategory: ""
        description: Manages a rule in the Cato app tenant restriction policy. Underlying GraphQL is marked @beta; behavior and fields may change.
        name: cato_app_tenant_restriction_rule
        title: cato_app_tenant_restriction_rule Resource - terraform-provider-cato
        examples:
            - name: bypass
              manifest: |-
                {
                  "at": {
                    "position": "LAST_IN_SECTION",
                    "ref": "${cato_app_tenant_restriction_section.example.section.id}"
                  },
                  "rule": {
                    "action": "BYPASS",
                    "application": {
                      "id": "microsoft_office_login"
                    },
                    "description": "Bypass tenant restriction for corporate users on weekdays",
                    "enabled": true,
                    "name": "TF ATR — Allow corporate Office 365 access",
                    "schedule": {
                      "active_on": "CUSTOM_RECURRING",
                      "custom_recurring": {
                        "days": [
                          "MONDAY",
                          "TUESDAY",
                          "WEDNESDAY",
                          "THURSDAY",
                          "FRIDAY"
                        ],
                        "from": "08:00",
                        "to": "18:00"
                      }
                    },
                    "severity": "MEDIUM",
                    "source": {
                      "ip": [
                        "198.51.100.40"
                      ]
                    }
                  }
                }
            - name: inject_headers
              manifest: |-
                {
                  "at": {
                    "position": "AFTER_RULE",
                    "ref": "${cato_app_tenant_restriction_rule.bypass.rule.id}"
                  },
                  "rule": {
                    "action": "INJECT_HEADERS",
                    "application": {
                      "id": "microsoft_office_login"
                    },
                    "description": "Restrict Microsoft 365 access to approved tenants only",
                    "enabled": true,
                    "headers": [
                      {
                        "name": "Restrict-Access-To-Tenants",
                        "value": "allowed-tenant-uuid"
                      },
                      {
                        "name": "Restrict-Access-Context",
                        "value": "your-directory-id"
                      }
                    ],
                    "name": "TF ATR — Inject M365 tenant restriction headers",
                    "schedule": {
                      "active_on": "ALWAYS"
                    },
                    "severity": "HIGH",
                    "source": {
                      "ip": [
                        "198.51.100.50"
                      ]
                    }
                  }
                }
        argumentDocs:
            action: (String) Rule action
            active_on: (String)
            application: (Attributes) Target application reference (see below for nested schema)
            at: (Attributes) Where to insert the rule (see below for nested schema)
            country: (Attributes Set) Source country matching criteria (see below for nested schema)
            custom_recurring: (Attributes) (see below for nested schema)
            custom_timeframe: (Attributes) (see below for nested schema)
            days: (List of String)
            description: (String) Rule description
            enabled: (Boolean) Whether the rule is enabled
            floating_subnet: (Attributes Set) Floating subnets (see below for nested schema)
            from: (String)
            global_ip_range: (Attributes Set) Globally defined IP range, IP and subnet objects (see below for nested schema)
            group: (Attributes Set) Groups defined for your account (see below for nested schema)
            headers: (Attributes List) HTTP headers to inject when action is INJECT_HEADERS (see below for nested schema)
            host: (Attributes Set) Hosts and servers defined for your account (see below for nested schema)
            id: (String) Rule ID
            ip: (List of String) IPv4 address list
            ip_range: (Attributes List) Multiple separate IP addresses or an IP range (see below for nested schema)
            name: (String) Rule name
            network_interface: (Attributes Set) Network interface defined for a site (see below for nested schema)
            position: (String) Position relative to policy, section, or another rule
            ref: (String) Reference rule or section ID when required by position
            rule: (Attributes) Rule definition (see below for nested schema)
            schedule: (Attributes) Schedule for the rule (see below for nested schema)
            severity: (String) Rule severity
            site: (Attributes Set) Site defined for the account (see below for nested schema)
            site_network_subnet: (Attributes Set) Site network subnet (see below for nested schema)
            source: (Attributes) Source traffic matching criteria (see below for nested schema)
            subnet: (List of String) Subnets and network ranges defined for the LAN interfaces of a site
            system_group: (Attributes Set) Predefined Cato groups (see below for nested schema)
            to: (String)
            user: (Attributes Set) Individual users defined for the account (see below for nested schema)
            users_group: (Attributes Set) Group of users (see below for nested schema)
            value: (String, Sensitive)
        importStatements:
            - terraform import cato_app_tenant_restriction_rule.example <rule_id>
    cato_app_tenant_restriction_section:
        subCategory: ""
        description: Manages a custom section in the Cato app tenant restriction (App & Data Inline Protection) policy. Adding a section can reassign existing rules into that section and create a draft revision; see provider documentation. Underlying GraphQL is marked @beta.
        name: cato_app_tenant_restriction_section
        title: cato_app_tenant_restriction_section Resource - terraform-provider-cato
        examples:
            - name: example
              manifest: |-
                {
                  "at": {
                    "position": "LAST_IN_POLICY"
                  },
                  "section": {
                    "name": "Terraform — Tenant Restriction"
                  }
                }
        argumentDocs:
            at: (Attributes) Where to insert the section (see below for nested schema)
            id: (String) Section ID
            name: (String) Section name
            position: (String) Position relative to policy or another section
            ref: (String) Reference section ID when position is AFTER_SECTION or BEFORE_SECTION
            section: (Attributes) Section name and computed ID (see below for nested schema)
        importStatements:
            - terraform import cato_app_tenant_restriction_section.example <section_id>
    cato_application_control_policy:
        subCategory: ""
        description: Account-level Application Control (App & Data Inline Protection) policy toggles. Underlying GraphQL is marked @beta.
        name: cato_application_control_policy
        title: cato_application_control_policy Resource - terraform-provider-cato
        examples:
            - name: example
              manifest: |-
                {
                  "data_control_enabled": "ENABLED",
                  "enabled": true
                }
        argumentDocs:
            data_control_enabled: (String) Data control feature toggle (ENABLED or DISABLED)
            enabled: (Boolean) Whether the Application Control policy is enabled
            id: (String) Fixed identifier for import
            published_by: (String) Last published by from audit
            published_time: (String) Last published time from audit
            revision_id: (String) Active draft revision ID when present
            revision_name: (String) Active draft revision name when present
        importStatements:
            - terraform import cato_application_control_policy.main application_control
    cato_application_control_rule:
        subCategory: ""
        description: Manages a rule in the Cato Application Control (App & Data Inline Protection) policy. Underlying GraphQL is marked @beta; behavior and fields may change.
        name: cato_application_control_rule
        title: cato_application_control_rule Resource - terraform-provider-cato
        examples:
            - name: application
              manifest: |-
                {
                  "at": {
                    "position": "LAST_IN_SECTION",
                    "ref": "${cato_application_control_section.example.section.id}"
                  },
                  "rule": {
                    "application_rule": {
                      "access_method": [
                        {
                          "access_method": "USER_AGENT",
                          "operator": "CONTAINS",
                          "value": "Mozilla"
                        }
                      ],
                      "action": "BLOCK",
                      "application": {
                        "application": [
                          {
                            "id": "slack"
                          }
                        ]
                      },
                      "schedule": {
                        "active_on": "CUSTOM_TIMEFRAME",
                        "custom_timeframe": {
                          "from": "2026-01-01T00:00:00Z",
                          "to": "2026-12-31T23:59:59Z"
                        }
                      },
                      "severity": "MEDIUM",
                      "source": {
                        "ip": [
                          "198.51.100.10"
                        ],
                        "ip_range": [
                          {
                            "from": "10.0.0.1",
                            "to": "10.0.0.20"
                          }
                        ],
                        "subnet": [
                          "203.0.113.0/24"
                        ]
                      },
                      "tracking": {
                        "alert": {
                          "enabled": false,
                          "frequency": "HOURLY"
                        },
                        "event": {
                          "enabled": true
                        }
                      }
                    },
                    "description": "Managed by Terraform",
                    "enabled": true,
                    "name": "TF — Block Slack uploads",
                    "rule_type": "APPLICATION"
                  }
                }
            - name: file
              manifest: |-
                {
                  "at": {
                    "position": "AFTER_RULE",
                    "ref": "${cato_application_control_rule.application.rule.id}"
                  },
                  "rule": {
                    "description": "Allow uploads over 100 MB during working hours",
                    "enabled": true,
                    "file_rule": {
                      "action": "ALLOW",
                      "application": {},
                      "application_activity": [
                        {
                          "activity": {
                            "id": "content_transfer_action_upload"
                          }
                        }
                      ],
                      "application_activity_satisfy": "ANY",
                      "file_attribute": [
                        {
                          "file_attribute": "CONTENT_SIZE",
                          "operator": "GREATER_THAN",
                          "value": "104857600"
                        }
                      ],
                      "file_attribute_satisfy": "ALL",
                      "schedule": {
                        "active_on": "WORKING_HOURS"
                      },
                      "severity": "MEDIUM",
                      "source": {
                        "ip": [
                          "198.51.100.30"
                        ]
                      },
                      "tracking": {
                        "alert": {
                          "enabled": false,
                          "frequency": "DAILY"
                        },
                        "event": {
                          "enabled": true
                        }
                      }
                    },
                    "name": "TF — Allow large file uploads",
                    "rule_type": "FILE"
                  }
                }
        argumentDocs:
            access_method: (Attributes List) Access method rows (see below for nested schema)
            action: (String) Rule action
            action_config: (Attributes) Action configuration (e.g. user notifications) (see below for nested schema)
            active_on: (String)
            activity: (Attributes) (see below for nested schema)
            alert: (Attributes) (see below for nested schema)
            app_category: (Attributes Set) Application categories (see below for nested schema)
            application: (Attributes) Application matching (WAN-shaped object) (see below for nested schema)
            application_activity: (Attributes List) Application activities to match (required for file/data rules when an application is specified) (see below for nested schema)
            application_activity_satisfy: (String) How application activities are combined (ALL | ANY)
            application_rule: (Attributes) Settings when rule_type is APPLICATION (see below for nested schema)
            at: (Attributes) Where to insert the rule (see below for nested schema)
            content_profile: (Attributes Set) (see below for nested schema)
            country: (Attributes Set) Source country matching criteria (see below for nested schema)
            custom_app: (Attributes Set) Custom applications (see below for nested schema)
            custom_category: (Attributes Set) Custom categories (see below for nested schema)
            custom_recurring: (Attributes) (see below for nested schema)
            custom_timeframe: (Attributes) (see below for nested schema)
            data_rule: (Attributes) Settings when rule_type is DATA (see below for nested schema)
            days: (List of String)
            description: (String) Rule description
            device: (Attributes Set) Device profiles (see below for nested schema)
            dlp_profile: (Attributes) DLP profile (data rules) (see below for nested schema)
            domain: (List of String) Second-level domains to match
            edm_profile: (Attributes Set) (see below for nested schema)
            enabled: (Boolean) Whether the rule is enabled
            event: (Attributes) (see below for nested schema)
            file_attribute: (Attributes List) File attribute rows (data/file rules) (see below for nested schema)
            file_attribute_satisfy: (String) How file attributes are combined
            file_rule: (Attributes) Settings when rule_type is FILE (see below for nested schema)
            floating_subnet: (Attributes Set) Floating subnets (see below for nested schema)
            fqdn: (List of String) FQDNs to match
            frequency: (String)
            from: (String)
            global_ip_range: (Attributes Set) Global IP range objects (see below for nested schema)
            group: (Attributes Set) Groups defined for your account (see below for nested schema)
            host: (Attributes Set) Hosts and servers defined for your account (see below for nested schema)
            id: (String) Rule ID
            ip: (List of String) IPv4 addresses
            ip_range: (Attributes List) Inclusive IP ranges (see below for nested schema)
            mailing_list: (Attributes Set) (see below for nested schema)
            name: (String) Rule name
            network_interface: (Attributes Set) Network interface defined for a site (see below for nested schema)
            operator: (String)
            position: (String) Position relative to policy, section, or another rule
            ref: (String) Reference rule or section ID when required by position
            rule: (Attributes) Rule definition (see below for nested schema)
            rule_type: (String) Which nested rule block is active
            sanctioned_apps_category: (Attributes Set) Sanctioned cloud application categories (see below for nested schema)
            schedule: (Attributes) Schedule for the typed rule (see below for nested schema)
            severity: (String) Rule severity
            site: (Attributes Set) Site defined for the account (see below for nested schema)
            site_network_subnet: (Attributes Set) Site network subnet (see below for nested schema)
            source: (Attributes) Source traffic matching criteria (see below for nested schema)
            subnet: (List of String) Subnets in CIDR notation
            subscription_group: (Attributes Set) (see below for nested schema)
            system_group: (Attributes Set) Predefined Cato groups (see below for nested schema)
            to: (String)
            tracking: (Attributes) Tracking configuration (see below for nested schema)
            user: (Attributes Set) Individual users defined for the account (see below for nested schema)
            user_notification: (Attributes Set) (see below for nested schema)
            users_group: (Attributes Set) Group of users (see below for nested schema)
            value: (String)
            webhook: (Attributes Set) (see below for nested schema)
        importStatements:
            - terraform import cato_application_control_rule.example <rule_id>
    cato_application_control_section:
        subCategory: ""
        description: Manages a custom section in the Cato Application Control (App & Data Inline Protection) policy. Adding a section can reassign existing rules into that section and create a draft revision; see provider documentation. Underlying GraphQL is marked @beta.
        name: cato_application_control_section
        title: cato_application_control_section Resource - terraform-provider-cato
        examples:
            - name: example
              manifest: |-
                {
                  "at": {
                    "position": "LAST_IN_POLICY"
                  },
                  "section": {
                    "name": "Terraform — Application Control"
                  }
                }
        argumentDocs:
            at: (Attributes) Where to insert the section (see below for nested schema)
            id: (String) Section ID
            name: (String) Section name
            position: (String) Position relative to policy or another section
            ref: (String) Reference section ID when position is AFTER_SECTION or BEFORE_SECTION
            section: (Attributes) Section name and computed ID (see below for nested schema)
        importStatements:
            - terraform import cato_application_control_section.example <section_id>
    cato_bgp_peer:
        subCategory: ""
        description: The cato_bgp_peerresource contains the configuration parameters necessary to add a BGP peer to a Cato site. Documentation for the underlying API used in this resource can be found at mutation.site.AddBgpPeerPayload() https://api.catonetworks.com/documentation/#definition-AddBgpPeerPayload.
        name: cato_bgp_peer
        title: cato_bgp_peer Resource - terraform-provider-cato
        examples:
            - name: bgp_peer
              manifest: |-
                {
                  "advertise_default_route": false,
                  "advertise_summary_routes": true,
                  "bfd_settings": {
                    "multiplier": 10,
                    "receive_interval": 100,
                    "transmit_interval": 100
                  },
                  "cato_asn": 65000,
                  "default_action": "ACCEPT",
                  "metric": 150,
                  "name": "vWAN BGP connectionn",
                  "peer_asn": 65100,
                  "peer_ip": "10.0.0.1",
                  "site_id": "12345",
                  "summary_route": [
                    {
                      "community": [
                        {
                          "from": 65005,
                          "to": 65010
                        }
                      ],
                      "route": "1.1.1.0/24"
                    },
                    {
                      "community": [
                        {
                          "from": 65015,
                          "to": 65020
                        }
                      ],
                      "route": "1.1.2.0/24"
                    }
                  ]
                }
        argumentDocs:
            advertise_all_routes: (Boolean) Advertise all routes if true.
            advertise_default_route: (Boolean) Advertise the default route (0.0.0.0/0) if true.
            advertise_summary_routes: (Boolean) Advertise summarized routes if true.
            alert_frequency: (String) Frequency of health alerts.
            bfd_enabled: (Boolean) Enable BFD for session failure detection if true.
            bfd_settings: (Attributes) Required BFD configuration if BFD is enabled. (see below for nested schema)
            cato_asn: (Number) The AS number of Cato's BGP endpoint.
            community: (Attributes List) Community values to associate with the summarized route. (see below for nested schema)
            default_action: (String) Default action for routes not matching filters (ACCEPT or DROP).
            enabled: (Boolean) Indicates if tracking is enabled.
            from: (Number) Start of the community range.
            hold_time: (Number) Time (in seconds) before declaring the peer unreachable.
            id: (String) Unique identifier for the BGP peer.
            keepalive_interval: (Number) Time (in seconds) between keepalive messages.
            md5_auth_key: (String, Sensitive) MD5 authentication key for secure sessions.
            metric: (Number) Route preference metric; lower values are given precedence.
            multiplier: (Number) Number of missed BFD packets before considering the session down.
            name: (String) Name of the BGP configuration entity
            peer_asn: (Number) The AS number of the peer BGP endpoint.
            peer_ip: (String) The IP address of the BGP peer, this is the configured ip from the Site->IPSec Tunnel (Primary or Secondary)->Private IPs->Site
            perform_nat: (Boolean) Perform NAT if true.
            receive_interval: (Number) Time interval (in milliseconds) in which this peer expects to receive BFD packets.
            route: (String) Subnet of the summarized route to be advertised.
            site_id: (String) Site Id
            subscription_id: (String) Subscription ID associated with this tracking rule.
            summary_route: (Attributes List) Summarized routes to advertise. (see below for nested schema)
            to: (Number) End of the community range.
            tracking: (Attributes) Configuration for tracking the health and status of the BGP peer. (see below for nested schema)
            transmit_interval: (Number) Time interval (in milliseconds) between BFD packets sent by this peer.
        importStatements: []
    cato_bulk_if_move_rule:
        subCategory: ""
        description: Retrieves index values for Internet Firewall Rules.
        name: cato_bulk_if_move_rule
        title: cato_bulk_if_move_rule Resource - terraform-provider-cato
        examples:
            - name: all_if_rules
              manifest: |-
                {
                  "depends_on": [
                    "${cato_if_section.all_if_sections}",
                    "${cato_if_rule.all_if_rules}"
                  ],
                  "rule_data": "${local.rule_data}",
                  "section_data": "${local.section_data}"
                }
              references:
                rule_data: local.rule_data
                section_data: local.section_data
              dependencies:
                cato_if_rule.all_if_rules: |-
                    {
                      "at": {
                        "position": "LAST_IN_POLICY"
                      },
                      "depends_on": [
                        "${cato_if_section.all_if_sections}"
                      ],
                      "for_each": "${{ for rule in local.rule_data : rule.rule_name =\u003e rule }}",
                      "rule": {
                        "action": "ALLOW",
                        "description": "${each.value.rule_name}",
                        "destination": {},
                        "enabled": true,
                        "name": "${each.value.rule_name}",
                        "source": {},
                        "tracking": {
                          "alert": {
                            "enabled": false,
                            "frequency": "DAILY"
                          },
                          "event": {
                            "enabled": true
                          }
                        }
                      }
                    }
                cato_if_section.all_if_sections: |-
                    {
                      "at": {
                        "position": "LAST_IN_POLICY"
                      },
