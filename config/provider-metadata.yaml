            network_interface: (Attributes Set) Network interfaces (see below for nested schema)
            port: (List of String) List of TCP/UDP port
            port_range: (Attributes) TCP/UDP port ranges (see below for nested schema)
            position: (String) Position relative to the parent rule (FIRST_IN_RULE, LAST_IN_RULE, AFTER_RULE, BEFORE_RULE)
            protocol: (String) IP Protocol (https://api.catonetworks.com/documentation/#definition-IpProtocol)
            ref: (String) The parent network rule ID or sibling firewall rule ID
            rule: (Attributes) Parameters for the Socket LAN firewall rule (see below for nested schema)
            service: (Attributes) Service matching criteria (see below for nested schema)
            simple: (Attributes Set) Simple services (see below for nested schema)
            site: (Attributes Set) Sites (see below for nested schema)
            site_network_subnet: (Attributes Set) Site network subnets (see below for nested schema)
            source: (Attributes) Source traffic matching criteria (see below for nested schema)
            standard: (Attributes Set) Standard services (see below for nested schema)
            subnet: (List of String) Subnets in CIDR notation
            subscription_group: (Attributes Set) Returns data for the Subscription Group that receives the alert (see below for nested schema)
            system_group: (Attributes Set) System groups (see below for nested schema)
            to: (String) End IP
            tracking: (Attributes) Tracking information when the rule is matched, such as events and notifications (see below for nested schema)
            vlan: (List of Number) VLAN IDs
            webhook: (Attributes Set) Returns data for the Webhook that receives the alert (see below for nested schema)
        importStatements: []
