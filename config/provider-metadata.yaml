            ip: (List of String) IPv4 address list
            ip_range: (Attributes List) IP address ranges (see below for nested schema)
            name: (String) Name of the rule
            network_interface: (Attributes Set) Network interfaces (see below for nested schema)
            platform: (String) Platform filter (ANDROID, EMBEDDED, IOS, LINUX, MACOS, WINDOWS)
            port: (List of String) Port list
            port_range: (Attributes) Port range (see below for nested schema)
            position: (String) Position relative to a policy, a section or another rule (FIRST_IN_POLICY, LAST_IN_POLICY, FIRST_IN_SECTION, LAST_IN_SECTION, BEFORE_RULE, AFTER_RULE)
            protocol: (String) Protocol (TCP, UDP, ICMP, ANY)
            ref: (String) The identifier of the object (e.g. a rule, a section) relative to which the position of the added rule is defined
            remote_asn: (List of String) Remote ASN list
            rule: (Attributes) Parameters for the rule you are adding (see below for nested schema)
            service: (Attributes Set) Services (see below for nested schema)
            site: (Attributes Set) Sites defined for your account (see below for nested schema)
            site_network_subnet: (Attributes Set) Site network subnets (see below for nested schema)
            source: (Attributes) Source traffic matching criteria. Logical 'OR' is applied within the criteria set. Logical 'AND' is applied between criteria sets. (see below for nested schema)
