    cato_license:
        subCategory: ""
        description: The cato_license resource contains the configuration parameters necessary to assign and replace licenses for sites. When creating a new license resource, the site_id and license_id attributes are required. The license_info attribute is optional and will be populated with the license information after the resource is created. If the site has an existing license assigned, the license resource will call the mutation.ReplaceSiteBwLicense() operation replacing the existing license with the new license_id ensuring there is no interruption in servive of reassigning a license. NOTE License assignment does not work for Trial accounts, or for accounts that are "not synced".
        name: cato_license
        title: cato_license Resource - terraform-provider-cato
        examples:
            - name: site-license
              manifest: |-
                {
                  "license_id": "abcde-1234-abcd-1234-abcde1234",
                  "site_id": "123456"
                }
            - name: site-pooled
              manifest: |-
                {
                  "bw": 40,
                  "license_id": "${data.cato_licensingInfo.pb_license.licenses[0].id}",
                  "site_id": "123456"
                }
              references:
                license_id: data.cato_licensingInfo.pb_license.licenses[0].id
        argumentDocs:
            allocated_bandwidth: (Number)
            bw: (Number) Bandwidth to allocate to site (only used for pooled license model)
            expiration_date: (String)
            id: (String) License ID
            last_updated: (String)
            license_id: (String) License ID
            license_info: (Attributes) (see below for nested schema)
            plan: (String)
            site_id: (String) Site ID
            site_license_group: (String)
            site_license_type: (String)
            sku: (String)
            start_date: (String)
            status: (String)
            total: (Number)
        importStatements: []
    cato_network_range:
        subCategory: ""
        description: The cato_network_range resource contains the configuration parameters necessary to add a network range to a cato site. (virtual socket in AWS/Azure, or physical socket https://support.catonetworks.com/hc/en-us/articles/4413280502929-Working-with-X1500-X1600-and-X1700-Socket-Sites). Documentation for the underlying API used in this resource can be found at mutation.addNetworkRange() https://api.catonetworks.com/documentation/#mutation-site.addNetworkRange.
        name: cato_network_range
        title: cato_network_range Resource - terraform-provider-cato
        examples:
            - name: direct
              manifest: |-
                {
                  "interface_id": "172922",
                  "local_ip": "192.166.100.1",
                  "mdns_reflector": true,
                  "name": "Direct Network Range",
                  "range_type": "Direct",
                  "site_id": "142382",
                  "subnet": "192.166.100.0/24",
                  "translated_subnet": "172.166.100.0/24"
                }
            - name: routed
              manifest: |-
                {
                  "gateway": "10.0.0.3",
                  "interface_id": "172922",
                  "internet_only": true,
                  "name": "Routed Network Range",
                  "range_type": "Routed",
                  "site_id": "142382",
                  "subnet": "192.167.100.0/24",
                  "translated_subnet": "172.167.100.0/24"
                }
            - name: vlan200
              manifest: |-
                {
                  "dhcp_settings": {
                    "dhcp_microsegmentation": false,
                    "dhcp_type": "DHCP_RANGE",
                    "ip_range": "192.168.200.100-192.168.200.150"
                  },
                  "internet_only": true,
                  "local_ip": "192.168.200.1",
                  "name": "VLAN200",
                  "range_type": "VLAN",
                  "site_id": "${cato_socket_site.site1.id}",
                  "subnet": "192.168.200.0/24",
                  "vlan": "200"
                }
              references:
                site_id: cato_socket_site.site1.id
            - name: vlan201_relay
              manifest: |-
                {
                  "dhcp_settings": {
                    "dhcp_microsegmentation": true,
                    "dhcp_type": "DHCP_RELAY",
                    "relay_group_name": "my_dhcp_relay"
                  },
                  "local_ip": "192.168.200.1",
                  "mdns_reflector": true,
                  "name": "VLAN201",
                  "range_type": "VLAN",
                  "site_id": "${cato_socket_site.site1.id}",
                  "subnet": "192.168.200.0/24",
                  "vlan": "200"
                }
              references:
                site_id: cato_socket_site.site1.id
        argumentDocs:
            dhcp_microsegmentation: (Boolean) DHCP Microsegmentation. When enabled, the DHCP server will allocate /32 subnet mask. Make sure to enable the proper Firewall rules and enable it with caution, as it is not supported on all operating systems; monitor the network closely after activation. This setting can only be configured when dhcp_type is set to DHCP_RANGE.
            dhcp_settings: (Attributes) Site native range DHCP settings (Only releveant for NATIVE and VLAN range_type) (see below for nested schema)
            dhcp_type: (String) Network range dhcp type (https://api.catonetworks.com/documentation/#definition-DhcpType)
            gateway: (String) Network range gateway (Only releveant for Routed range_type)
            id: (String) Network Range ID
            interface_id: (String) Network Interface ID
            interface_index: (String) Network Interface Index
            internet_only: (Boolean) Internet only network range (Only releveant for Routed range_type)
            ip_range: (String) Network range dhcp range (format "192.168.1.10-192.168.1.20")
            local_ip: (String) Network range local ip
            mdns_reflector: (Boolean) Site native range mDNS reflector. When enabled, the Socket functions as an mDNS gateway, it relays mDNS requests and response between all enabled subnets.
            name: (String) Network range name
            range_type: (String) Network range type (https://api.catonetworks.com/documentation/#definition-SubnetType)
            relay_group_id: (String) Network range dhcp relay group id
            relay_group_name: (String) Network range dhcp relay group name
            site_id: (String) Site ID
            subnet: (String) Network range (CIDR)
            translated_subnet: (String) Network range translated native IP range (CIDR)
            vlan: (Number) Network range VLAN ID (Only releveant for VLAN range_type)
        importStatements: []
    cato_private_access_policy:
