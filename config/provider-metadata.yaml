        argumentDocs:
            action: (String) The action applied by the Wan Firewall if the rule is matched (https://api.catonetworks.com/documentation/#definition-WanFirewallActionEnum)
            active_on: (String) Define when the rule is active (https://api.catonetworks.com/documentation/#definition-PolicyActiveOnEnum)
            active_period: (Attributes) Time period during which the rule is active. Outside this period, the rule is inactive. Times should be in RFC3339 format (e.g., '2024-12-31T23:59:59Z'). (see below for nested schema)
            alert: (Attributes) When enabled, send an alert each time the rule is matched (see below for nested schema)
            app_category: (Attributes Set) Cato category of applications which are dynamically updated by Cato (see below for nested schema)
            application: (Attributes) Application traffic matching criteria. Logical 'OR' is applied within the criteria set. Logical 'AND' is applied between criteria sets. Can be an empty object {} to match any application. (see below for nested schema)
            at: (Attributes) Position of the rule in the policy (see below for nested schema)
            category: (List of String) Device category matching criteria for the rule.
            connection_origin: (String) Connection origin of the traffic (https://api.catonetworks.com/documentation/#definition-ConnectionOriginEnum)
            country: (Attributes Set) Source country traffic matching criteria. Logical ‘OR’ is applied within the criteria set. Logical ‘AND’ is applied between criteria sets. (see below for nested schema)
            custom: (Attributes List) (see below for nested schema)
            custom_app: (Attributes Set) Custom (user-defined) applications (see below for nested schema)
            custom_category: (Attributes Set) Custom Categories – Groups of objects such as predefined and custom applications, predefined and custom services, domains, FQDNs etc. (see below for nested schema)
            custom_recurring: (Attributes) Input of data for a custom recurring time range that a rule is active (see below for nested schema)
            custom_timeframe: (Attributes) Input of data for a custom one-time time range that a rule is active (see below for nested schema)
            days: (List of String) Custom Recurring Days - (https://api.catonetworks.com/documentation/#definition-DayOfWeek)
            description: (String) Description of the rule
            destination: (Attributes) Destination traffic matching criteria. Logical 'OR' is applied within the criteria set. Logical 'AND' is applied between criteria sets. Can be an empty object {} to match any destination. (see below for nested schema)
            device: (Attributes Set) Source Device Profile traffic matching criteria. Logical 'OR' is applied within the criteria set. Logical 'AND' is applied between criteria sets. (see below for nested schema)
            device_attributes: (Attributes) Device attributes matching criteria for the rule. (see below for nested schema)
            device_os: (List of String) Source device Operating System traffic matching criteria. Logical ‘OR’ is applied within the criteria set. Logical ‘AND’ is applied between criteria sets.(https://api.catonetworks.com/documentation/#definition-OperatingSystem)
            direction: (String) Define the direction on which the rule is applied (https://api.catonetworks.com/documentation/#definition-WanFirewallDirectionEnum)
            domain: '(List of String) A Second-Level Domain (SLD). It matches all Top-Level Domains (TLD), and subdomains that include the Domain. Example: example.com.'
            effective_from: (String) The time the rule becomes active (RFC3339 format, e.g., '2024-01-01T00:00:00Z'). If not specified, the rule is active from creation.
            enabled: (Boolean) Attribute to define rule status (enabled or disabled)
            event: (Attributes) When enabled, create an event each time the rule is matched (see below for nested schema)
            exceptions: (Attributes Set) The set of exceptions for the rule. Exceptions define when the rule will be ignored and the firewall evaluation will continue with the lower priority rules. (see below for nested schema)
            expires_at: (String) The time the rule expires and becomes inactive (RFC3339 format, e.g., '2024-12-31T23:59:59Z'). If not specified, the rule never expires.
            floating_subnet: (Attributes Set) Floating Subnets (ie. Floating Ranges) are used to identify traffic exactly matched to the route advertised by BGP. They are not associated with a specific site. This is useful in scenarios such as active-standby high availability routed via BGP. (see below for nested schema)
            fqdn: '(List of String) An exact match of the fully qualified domain (FQDN). Example: www.my.example.com.'
            frequency: (String) Returns data for the alert frequency (https://api.catonetworks.com/documentation/#definition-PolicyRuleTrackingFrequencyEnum)
            from: (String) IP Range Name
            global_ip_range: (Attributes Set) Globally defined IP range, IP and subnet objects. (see below for nested schema)
            group: (Attributes Set) Groups defined for your account (see below for nested schema)
            host: (Attributes Set) Hosts and servers defined for your account (see below for nested schema)
            id: (String) ID of the rule
            ip: (List of String) IPv4 addresses
            ip_range: (Attributes List) A range of IPs. Every IP within the range will be matched (see below for nested schema)
            mailing_list: (Attributes Set) Returns data for the Mailing List that receives the alert (see below for nested schema)
            manufacturer: (List of String) Device manufacturer matching criteria for the rule.
            model: (List of String) Device model matching criteria for the rule.
            name: (String) Name of the rule
            network_interface: (Attributes Set) Network range defined for a site (see below for nested schema)
            os: (List of String) Device OS matching criteria for the rule.
            os_version: (List of String) Device OS version matching criteria for the rule.
            port: (List of String) Custom Service Port
            port_range: (Attributes) (see below for nested schema)
            position: (String) Position relative to a policy, a section or another rule
            protocol: (String) Protocol matching criteria for the exception.
            ref: (String) The identifier of the object (e.g. a rule, a section) relative to which the position of the added rule is defined
            rule: (Attributes) Parameters for the rule you are adding (see below for nested schema)
            sanctioned_apps_category: (Attributes Set) Sanctioned Cloud Applications - apps that are approved and generally represent an understood and acceptable level of risk in your organization. (see below for nested schema)
            schedule: (Attributes) The time period specifying when the rule is enabled, otherwise it is disabled. (see below for nested schema)
            service: (Attributes) Destination service traffic matching criteria. Logical 'OR' is applied within the criteria set. Logical 'AND' is applied between criteria sets. (see below for nested schema)
            site: (Attributes Set) Site defined for the account (see below for nested schema)
            site_network_subnet: (Attributes Set) GlobalRange + InterfaceSubnet (see below for nested schema)
            source: (Attributes) Source traffic matching criteria. Logical 'OR' is applied within the criteria set. Logical 'AND' is applied between criteria sets. Can be an empty object {} to match any source. (see below for nested schema)
            standard: (Attributes Set) (see below for nested schema)
            sub_policy_id: '(String) Optional ID of a cato_wf_sub_policy that should own this rule. When set, the rule is created inside the sub-policy (positioned before the sub-policy cleanup rule). Immutable: changing it forces replacement.'
            subnet: (List of String) Network subnets in CIDR notation
            subscription_group: (Attributes Set) Returns data for the Subscription Group that receives the alert (see below for nested schema)
            system_group: (Attributes Set) Predefined Cato groups (see below for nested schema)
            to: (String) IP Range ID
            tracking: (Attributes) Tracking information when the rule is matched, such as events and notifications (see below for nested schema)
            type: (List of String) Device type matching criteria for the rule.
            use_effective_from: (Boolean) Whether to use the effective_from time. Computed from the presence of effective_from field.
            use_expires_at: (Boolean) Whether to use the expires_at time. Computed from the presence of expires_at field.
            user: (Attributes Set) Individual users defined for the account (see below for nested schema)
            users_group: (Attributes Set) Group of users (see below for nested schema)
            webhook: (Attributes Set) Returns data for the Webhook that receives the alert (see below for nested schema)
        importStatements: []
    cato_wf_section:
        subCategory: ""
        description: The cato_wf_section resource contains the configuration parameters necessary to WAN firewall section (https://support.catonetworks.com/hc/en-us/articles/5590037900701-Adding-Sections-to-the-WAN-and-Internet-Firewalls). Documentation for the underlying API used in this resource can be found at mutation.policy.wanFirewall.addSection() https://api.catonetworks.com/documentation/#mutation-policy.wanFirewall.addSection.
